AWSTemplateFormatVersion: "2010-09-09"
Description: Weekly meetings report (EventBridge Scheduler -> SQS -> Lambda -> S3 -> Lambda -> SES)

Parameters:
  ProjectName:
    Type: String
    Default: spry
  BuilderImageUri:
    Type: String
    Description: Backend container image URI
  PrivateSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
  PrivateRouteTableIds:
    Type: CommaDelimitedList
  VpcId:
    Type: AWS::EC2::VPC::Id
  LambdaSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
  SenderEmail:
    Type: String
    Default: zavada.sofia@gmail.com
    Description: Verified sender email or domain in SES
  RecipientEmails:
    Type: String
    Default: zavada.sofia@gmail.com
    Description: Comma-separated recipients (must be SES-verified in sandbox)
  DatabaseUrl:
    Type: String
    NoEcho: true
    Description: PostgreSQL connection URL for Aurora Serverless v2

Resources:
  # ---------- Reports bucket ----------
  ReportsBucket:
    Type: AWS::S3::Bucket
    DependsOn: MailerInvokePermission
    Properties:
      BucketName: !Sub ${ProjectName}-reports-${AWS::AccountId}   # explicit on purpose
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: expire-reports-90d
            Status: Enabled
            Prefix: reports/
            ExpirationInDays: 90
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: s3:ObjectCreated:*
            Function: !GetAtt MailerFunction.Arn
            Filter:
              S3Key:
                Rules:
                  - { Name: prefix, Value: reports/ }
                  - { Name: suffix, Value: .csv }
      Tags: [{ Key: Project, Value: !Ref ProjectName }]

  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcEndpointType: Gateway
      VpcId: !Ref VpcId
      ServiceName: !Sub com.amazonaws.${AWS::Region}.s3
      RouteTableIds: !Ref PrivateRouteTableIds

  # ---------- SQS queue and DLQ ----------
  ReportRequestsDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${ProjectName}-report-requests-dlq
      MessageRetentionPeriod: 1209600          # 14 days
      Tags: [{ Key: Project, Value: !Ref ProjectName }]

  ReportRequestsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${ProjectName}-report-requests
      VisibilityTimeout: 360                   # >= 6 x builder timeout (60 s)
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ReportRequestsDLQ.Arn
        maxReceiveCount: 3
      Tags: [{ Key: Project, Value: !Ref ProjectName }]

  BuilderQueueMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt ReportRequestsQueue.Arn
      FunctionName: !Ref BuilderFunction
      BatchSize: 1

  # ---------- Report builder Lambda ----------
  BuilderRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - { Effect: Allow, Principal: { Service: lambda.amazonaws.com }, Action: sts:AssumeRole }
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: builder
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub arn:aws:s3:::${ProjectName}-reports-${AWS::AccountId}/reports/*
              - Effect: Allow
                Action: [sqs:ReceiveMessage, sqs:DeleteMessage, sqs:GetQueueAttributes]
                Resource: !GetAtt ReportRequestsQueue.Arn
              - Effect: Allow
                Action: rds-db:connect
                Resource: !Sub arn:aws:rds-db:${AWS::Region}:${AWS::AccountId}:dbuser:cluster-JNMT4I3SCKAVPZXHHCXBZAM2ZI/postgres

  BuilderFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${ProjectName}-report-builder
      PackageType: Image
      Code: { ImageUri: !Ref BuilderImageUri }
      ImageConfig:
        Command: ["app.reports.lambda_handler.handler"]
      Role: !GetAtt BuilderRole.Arn
      Timeout: 60
      MemorySize: 512
      Environment:
        Variables:
          REPORTS_BUCKET: !Sub ${ProjectName}-reports-${AWS::AccountId}
          DATABASE_URL: !Ref DatabaseUrl
      Tags: [{ Key: Project, Value: !Ref ProjectName }]

  SchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - { Effect: Allow, Principal: { Service: scheduler.amazonaws.com }, Action: sts:AssumeRole }
      Policies:
        - PolicyName: invoke-queue
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt ReportRequestsQueue.Arn

  WeeklySchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub ${ProjectName}-weekly-report
      ScheduleExpression: cron(0 7 ? * MON *)
      ScheduleExpressionTimezone: Europe/Kyiv
      FlexibleTimeWindow: { Mode: "OFF" }
      Target:
        Arn: !GetAtt ReportRequestsQueue.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: '{"week": null, "source": "schedule"}'

  # ---------- Report mailer Lambda ----------
  MailerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - { Effect: Allow, Principal: { Service: lambda.amazonaws.com }, Action: sts:AssumeRole }
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: mailer
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:GetObject                       # read-only; never PutObject
                Resource: !Sub arn:aws:s3:::${ProjectName}-reports-${AWS::AccountId}/reports/*
              - Effect: Allow
                Action:
                  - ses:SendRawEmail
                  - ses:SendEmail
                Resource: "*"

  MailerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${ProjectName}-report-mailer
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt MailerRole.Arn
      Timeout: 30
      Environment:
        Variables:
          SENDER: !Ref SenderEmail
          RECIPIENTS: !Ref RecipientEmails
      Code:
        ZipFile: |
          import os, urllib.parse
          from email.message import EmailMessage
          import boto3

          s3 = boto3.client("s3")
          ses = boto3.client("sesv2")

          def handler(event, context):
              rec = event["Records"][0]
              bucket = rec["s3"]["bucket"]["name"]
              key = urllib.parse.unquote_plus(rec["s3"]["object"]["key"])
              print(f"report-mailer triggered trigger=s3 bucket={bucket} key={key}")

              body = s3.get_object(Bucket=bucket, Key=key)["Body"].read()
              week = key.rsplit("/", 1)[-1].removesuffix(".csv")
              recipients = [r.strip() for r in os.environ["RECIPIENTS"].split(",") if r.strip()]

              msg = EmailMessage()
              msg["Subject"] = f"Weekly meetings report {week}"
              msg["From"] = os.environ["SENDER"]
              msg["To"] = ", ".join(recipients)
              msg.set_content(f"Your weekly meetings report for {week} is attached.")
              msg.add_attachment(body, maintype="text", subtype="csv", filename=f"{week}.csv")

              ses.send_email(Content={"Raw": {"Data": msg.as_bytes()}})
              print(f"report-mailer sent key={key} to={len(recipients)} recipients")
              # NOTE: never write to reports/ from this function.

  MailerInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref MailerFunction
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceArn: !Sub arn:aws:s3:::${ProjectName}-reports-${AWS::AccountId}
      SourceAccount: !Ref AWS::AccountId

  # ---------- SES email identity ----------
  EmailIdentity:
    Type: AWS::SES::EmailIdentity
    Properties:
      EmailIdentity: !Ref SenderEmail

Outputs:
  ReportsBucketName:
    Value: !Ref ReportsBucket
  ReportRequestsQueueUrl:
    Value: !Ref ReportRequestsQueue
  ReportRequestsDlqUrl:
    Value: !Ref ReportRequestsDLQ
  VerifiedEmailIdentity:
    Value: !Ref EmailIdentity
