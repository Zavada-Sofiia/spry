AWSTemplateFormatVersion: "2010-09-09"
Description: Spry AI Agenda Parser Lambda with Function URL and Bedrock Mantle access

Parameters:
  ProjectName:
    Type: String
    Default: spry
  ParserImageUri:
    Type: String
    Description: Backend container image URI containing app.ai.agenda_lambda
  SiteUrl:
    Type: String
    Default: https://d1pk13cbcfrq49.cloudfront.net
  UserPoolId:
    Type: String
    Default: eu-north-1_VArufRzST
  UserPoolClientId:
    Type: String
    Default: 40q78hb988egmd17hs07hci1vh
  CognitoRegion:
    Type: String
    Default: eu-north-1
  ParserModel:
    Type: String
    Default: anthropic.claude-opus-5-5
  MockAi:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"

Resources:
  # ---------- IAM Role ----------
  ParserRole:
    Type: AWS::IAM::Role
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RoleName: !Sub ${ProjectName}-agenda-parser-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: BedrockMantleInference
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - bedrock-mantle:CreateInference
                  - bedrock:InvokeModel
                Resource: "*"
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # ---------- Lambda Function (No VpcConfig) ----------
  ParserFunction:
    Type: AWS::Lambda::Function
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      FunctionName: !Sub ${ProjectName}-agenda-parser
      PackageType: Image
      Code:
        ImageUri: !Ref ParserImageUri
      ImageConfig:
        Command: ["app.ai.agenda_lambda.handler"]
      Role: !GetAtt ParserRole.Arn
      Timeout: 30
      MemorySize: 512
      Environment:
        Variables:
          PARSER_MODEL: !Ref ParserModel
          COGNITO_USER_POOL_ID: !Ref UserPoolId
          COGNITO_CLIENT_ID: !Ref UserPoolClientId
          COGNITO_REGION: !Ref CognitoRegion
          MOCK_AI: !Ref MockAi
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # ---------- Function URL (Public with auth checked inside function) ----------
  ParserFunctionUrl:
    Type: AWS::Lambda::Url
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TargetFunctionArn: !GetAtt ParserFunction.Arn
      AuthType: NONE
      Cors:
        AllowOrigins:
          - !Ref SiteUrl
          - "http://localhost:3000"
          - "http://localhost:5173"
        AllowMethods:
          - POST
        AllowHeaders:
          - authorization
          - content-type
        MaxAge: 300

  ParserFunctionUrlPermission:
    Type: AWS::Lambda::Permission
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      FunctionName: !Ref ParserFunction
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  ParserFunctionInvokePermission:
    Type: AWS::Lambda::Permission
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      FunctionName: !Ref ParserFunction
      Action: lambda:InvokeFunction
      Principal: "*"

Outputs:
  ParserFunctionArn:
    Description: ARN of the agenda parser Lambda
    Value: !GetAtt ParserFunction.Arn
  ParserFunctionUrl:
    Description: Function URL endpoint for the agenda parser
    Value: !GetAtt ParserFunctionUrl.FunctionUrl
